name: Build JARVIS APK

on:
  push:
    branches: [main, tamil-language-final]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle
      - name: Build debug APK
        run: chmod +x ./gradlew && ./gradlew assembleDebug --stacktrace
      - name: Print CI signing fingerprints
        run: |
          echo "CI debug keystore SHA-1:"
          keytool -list -v -keystore "$HOME/.android/debug.keystore" -alias androiddebugkey -storepass android -keypass android | grep -E 'SHA1:|SHA-256:'

      - name: Build release APK
        run: ./gradlew assembleRelease --stacktrace
      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: JARVIS-tamil-debug
          path: app/build/outputs/apk/debug/app-debug.apk
      - name: Upload release APK
        uses: actions/upload-artifact@v4
        with:
          name: JARVIS-tamil-release
          path: app/build/outputs/apk/release/app-release.apk
