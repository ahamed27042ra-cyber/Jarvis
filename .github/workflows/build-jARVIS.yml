name: Build JARVIS APK

on:
  push:
    branches: [main, tamil-language-final]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle
      - name: Build debug APK
        run: chmod +x ./gradlew && ./gradlew assembleDebug --stacktrace
      - name: Print CI signing fingerprints
        run: |
          echo "CI signing fingerprints:"
          ./gradlew signingReport --stacktrace | grep -E 'Variant:|Store:|Alias:|SHA1:|SHA-256:'

      - name: Build release APK
        run: ./gradlew assembleRelease --stacktrace
      - name: Extract APK signing certificates
        run: |
          APKSIGNER=$(find "$ANDROID_HOME/build-tools" -name apksigner | sort -V | tail -1)
          echo "Using apksigner: $APKSIGNER"
          "$APKSIGNER" verify --print-certs app/build/outputs/apk/debug/app-debug.apk > debug-apk-certs.txt
          "$APKSIGNER" verify --print-certs app/build/outputs/apk/release/app-release.apk > release-apk-certs.txt
          echo "=== DEBUG APK CERTIFICATE ==="
          cat debug-apk-certs.txt
          echo "=== RELEASE APK CERTIFICATE ==="
          cat release-apk-certs.txt

      - name: Upload signing certificate report
        uses: actions/upload-artifact@v4
        with:
          name: JARVIS-signing-certificates
          path: |
            debug-apk-certs.txt
            release-apk-certs.txt

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: JARVIS-tamil-debug
          path: app/build/outputs/apk/debug/app-debug.apk
      - name: Upload release APK
        uses: actions/upload-artifact@v4
        with:
          name: JARVIS-tamil-release
          path: app/build/outputs/apk/release/app-release.apk
