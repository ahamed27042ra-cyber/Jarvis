name: Deploy JARVIS Web Console to GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - 'web-console/**'
      - '.github/workflows/deploy-web-console.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: 'jarvis-web-pages'
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Prepare site artifact
        run: |
          mkdir -p public
          cp web-console/index.html public/index.html
          cp web-console/manifest.webmanifest public/manifest.webmanifest
          cp web-console/sw.js public/sw.js
          cp web-console/icon.svg public/icon.svg
          touch public/.nojekyll
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: public
      - name: Deploy to Pages
        id: deployment
        uses: actions/deploy-pages@v4
